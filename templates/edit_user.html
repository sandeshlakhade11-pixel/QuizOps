<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit User - QuizOps</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 35px; width: 100%; max-width: 450px; }
        .header { text-align: center; margin-bottom: 25px; }
        .header h2 { font-size: 22px; color: #38bdf8; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 13px; color: #cbd5e1; margin-bottom: 6px; }
        .form-group input, .form-group select { width: 100%; padding: 11px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #f8fafc; outline: none; }
        .btn-container { display: flex; gap: 10px; margin-top: 25px; }
        .btn-save { flex: 1; padding: 11px; background: #0284c7; color: white; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; text-align: center; text-decoration: none; }
        .btn-cancel { flex: 1; padding: 11px; background: #475569; color: white; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; text-align: center; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <h2><i class="fa-solid fa-user-pen"></i> Edit User Details</h2>
        </div>
        <form method="POST" action="/edit_user/{{ user['id'] }}">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" value="{{ user['username'] }}" required>
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" value="{{ user['email'] }}" required>
            </div>
            <div class="form-group">
                <label>Role</label>
                <select name="role" required>
                    <option value="Student" {% if user['role'] == 'Student' %}selected{% endif %}>Student</option>
                    <option value="Teacher" {% if user['role'] == 'Teacher' %}selected{% endif %}>Teacher</option>
                    <option value="Admin" {% if user['role'] == 'Admin' %}selected{% endif %}>Admin</option>
                </select>
            </div>
            <div class="btn-container">
                <button type="submit" class="btn-save">Save Changes</button>
                <a href="/admin/dashboard" class="btn-cancel">Cancel</a>
            </div>
        </form>
    </div>
</body>
</html>
