<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Quiz - QuizOps</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 35px; width: 100%; max-width: 500px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); }
        .header { text-align: center; margin-bottom: 25px; }
        .header h2 { font-size: 22px; color: #38bdf8; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: #cbd5e1; margin-bottom: 6px; }
        .form-group input, .form-group textarea { width: 100%; padding: 11px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #f8fafc; font-size: 14px; outline: none; }
        .form-group input:focus, .form-group textarea:focus { border-color: #38bdf8; }
        .btn-container { display: flex; gap: 10px; margin-top: 25px; }
        .btn-submit { flex: 1; padding: 12px; background: #0284c7; color: white; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; text-align: center; }
        .btn-submit:hover { background: #0369a1; }
        .btn-cancel { flex: 1; padding: 12px; background: #475569; color: white; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; text-align: center; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <h2><i class="fa-solid fa-plus-circle"></i> Create New Quiz</h2>
        </div>
        <form method="POST" action="/create_quiz">
            <div class="form-group">
                <label>Quiz Title</label>
                <input type="text" name="title" placeholder="e.g. Python Basics Quiz" required>
            </div>
            <div class="form-group">
                <label>Subject</label>
                <input type="text" name="subject" placeholder="e.g. Computer Science" required>
            </div>
            <div class="form-group">
                <label>Description</label>
                <textarea name="description" rows="3" placeholder="Enter quiz instructions..."></textarea>
            </div>
            <div class="form-group">
                <label>Duration (Minutes)</label>
                <input type="number" name="duration" placeholder="e.g. 15" required>
            </div>
            <div class="form-group">
                <label>Passing Percentage (%)</label>
                <input type="number" name="pass_percentage" placeholder="e.g. 50" required>
            </div>
            <div class="btn-container">
                <button type="submit" class="btn-submit">Save & Add Questions</button>
                <a href="/" class="btn-cancel">Cancel</a>
            </div>
        </form>
    </div>
</body>
</html>
